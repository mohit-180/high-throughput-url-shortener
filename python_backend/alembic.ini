# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, space-separated, to search for modules
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max characters of slug to include in file name
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow empty migrations
# allow_empty_history = false

# version locations.  defaults to alembic/versions.
# version_locations = %(here)s/alembic/versions

# version_path_separator = :

# set to 'true' to enable searching for versions across subdirectories
# recursive_version_locations = false

# set to 'true' to write version files using newline format of current platform
# output_encoding = utf-8

sqlalchemy.url = postgresql+asyncpg://postgres:postgres_secure_pass@localhost:5432/url_shortener


[logging]
default_level = INFO
handlers = console
qualname =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
