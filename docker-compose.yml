version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: url_shortener_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./python_backend
      dockerfile: Dockerfile
    container_name: url_shortener_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_pass@postgres:5432/url_shortener
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_NAME=High Throughput URL Shortener and Analytics Engine
      - DEBUG=True
      - API_V1_STR=/api/v1
      - REDIS_TTL_SECONDS=300
      - RATE_LIMIT_PER_MINUTE=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./python_backend:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url_shortener_frontend
    restart: always
    ports:
      - "3000+:3000"
    depends_on:
      - fastapi
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:


